<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF1100" />
    </linearGradient>
  </defs>
  <g transform="translate(10, 10)">
    <!-- High-end modern geometric logo emblem -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logo-grad)" />
    <!-- Stylized modern "S" monogram -->
    <path d="M 40 20 C 40 14, 20 14, 20 25 C 20 35, 40 31, 40 41 C 40 52, 20 52, 20 46" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" fill="none" />
    
    <!-- Clean typographic text -->
    <text x="75" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-1px">Skill<tspan fill="#FF5500">Sha</tspan></text>
  </g>
</svg>